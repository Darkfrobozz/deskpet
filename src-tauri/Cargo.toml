[package]
name = "deskpet"
version = "0.0.1"
description = "A small always-on-top desktop companion"
authors = ["darkfrobozz"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is required for a transparent window on macOS (it uses NSWindow's
# private transparency path). It must stay in sync with `app.macOSPrivateApi` in tauri.conf.json
# — tauri-build fails the build if the two disagree.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
