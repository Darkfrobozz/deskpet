<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>shrimp rig builder</title>
    <style>
      html,
      body {
        margin: 0;
        background: #10141a;
        color: #8fa5b8;
        font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
        overflow: hidden;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      .bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 7px 9px;
        background: rgba(9, 13, 18, 0.92);
        border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        backdrop-filter: blur(8px);
        z-index: 10;
      }
      .bar button {
        font: inherit;
        color: #a8bccd;
        background: #1b222b;
        border: 1px solid #2b3540;
        border-radius: 5px;
        padding: 4px 9px;
        cursor: pointer;
      }
      .bar button:hover {
        border-color: #3d4c5b;
        color: #d6e4f0;
      }
      .bar button.on {
        background: #1f3a38;
        border-color: #2f6a63;
        color: #8fe6d6;
      }
      .bar .sep {
        width: 1px;
        background: #253039;
        margin: 0 3px;
      }
      .hud {
        position: fixed;
        left: 0;
        bottom: 0;
        right: 0;
        padding: 7px 9px;
        background: rgba(9, 13, 18, 0.92);
        border-top: 1px solid rgba(255, 255, 255, 0.07);
        white-space: pre;
        z-index: 10;
        color: #7f97ab;
      }
      .hud b {
        color: #ffd166;
        font-weight: 600;
      }
      .hud i {
        color: #38e0c4;
        font-style: normal;
      }
      textarea {
        position: fixed;
        inset: 44px 12px 62px 12px;
        background: #0b0f14;
        color: #b9cbda;
        border: 1px solid #2b3540;
        border-radius: 6px;
        font: 11px/1.5 ui-monospace, monospace;
        padding: 10px;
        z-index: 20;
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      /*
       * SHRIMP RIG BUILDER
       *
       * You place dots and draw bones between them. Two tools:
       *   DRAW  — press on empty space (new root bone) or on a dot (new child bone), drag out.
       *   MOVE  — drag a dot to move it, drag a bone body to swing it around its head.
       *
       * Bones store their rest pose as world-space head/tail points. Parent-relative angles are
       * derived at solve time, so hand-placed geometry is always exactly what you drew.
       *
       *   ?mode=build     the builder (default)
       *   ?mode=compare   shapes / bones / overlay of the current rig
       *   ?mode=small     64 px silhouette test
       *
       * KEYS
       *   tab        draw / move tool
       *   K          cycle shape kind of the selected bone
       *   [ ]        width (shift = tip width only)
       *   , .        draw order (layer) back / forward
       *   del        delete selected bone and its children
       *   C          export JSON      L  import JSON (paste, ctrl+enter)
       *   R          reset to the shrimp preset      X  clear everything
       *   V          view: shapes / bones / overlay      G  wobble test
       */

      const S = 132;
      const KINDS = ['limb', 'segment', 'blade', 'shell', 'none'];

      const C = {
        body: '#FF6A45',
        shade: '#C93B22',
        hi: 'rgba(255, 241, 232, 0.72)',
        eye: '#1A1114',
        bone: '#38E0C4',
        joint: '#FFD166',
        sel: '#FFD166',
        node: 'rgba(255, 209, 102, 0.75)',
      };

      const PAL = { body: C.body, shade: C.shade };

      const rot = (p, a) => ({
        x: p.x * Math.cos(a) - p.y * Math.sin(a),
        y: p.x * Math.sin(a) + p.y * Math.cos(a),
      });
      const D2R = Math.PI / 180;
      const deg = (d) => d * D2R;
      const hyp = (a, b) => Math.hypot(b.x - a.x, b.y - a.y);
      const ang = (a, b) => Math.atan2(b.y - a.y, b.x - a.x);

      // ---------------------------------------------------------------- shape drawing

      function limb(ctx, p0, p1, w0, w1, color) {
        const dx = p1.x - p0.x;
        const dy = p1.y - p0.y;
        const len = Math.hypot(dx, dy) || 1;
        const nx = -dy / len;
        const ny = dx / len;
        const r0 = Math.max(0.35, w0 / 2);
        const r1 = Math.max(0.35, w1 / 2);
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(p1.x, p1.y, r1, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(p0.x, p0.y, r0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(p0.x + nx * r0, p0.y + ny * r0);
        ctx.lineTo(p1.x + nx * r1, p1.y + ny * r1);
        ctx.lineTo(p1.x - nx * r1, p1.y - ny * r1);
        ctx.lineTo(p0.x - nx * r0, p0.y - ny * r0);
        ctx.closePath();
        ctx.fill();
      }

      function shellShape(ctx, b, color) {
        const len = b.len || 1;
        const halfW = Math.max(4, b.w0 * 0.5);
        ctx.save();
        ctx.translate(b.hx, b.hy);
        ctx.rotate(b.wa);
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(0.02 * len, -0.9 * halfW);
        ctx.bezierCurveTo(0.4 * len, -1.05 * halfW, 0.82 * len, -0.78 * halfW, 1.0 * len, -0.09 * halfW);
        ctx.lineTo(1.3 * len, -0.45 * halfW); // rostrum
        ctx.lineTo(0.98 * len, 0.02 * halfW);
        ctx.bezierCurveTo(0.84 * len, 0.72 * halfW, 0.44 * len, 0.95 * halfW, 0.04 * len, 0.86 * halfW);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
        // eye, in the shell's local frame
        const e = rot({ x: 0.72 * len, y: -0.34 * halfW }, b.wa);
        ctx.fillStyle = C.eye;
        ctx.beginPath();
        ctx.arc(b.hx + e.x, b.hy + e.y, 2.3, 0, Math.PI * 2);
        ctx.fill();
      }

      /** Draw one bone's shape, in solved world space. */
      function drawBone(ctx, b) {
        if (!b.len) return;
        const color = PAL[b.color] || C.body;
        const h = { x: b.hx, y: b.hy };
        const t = { x: b.tx, y: b.ty };
        const nx = -Math.sin(b.wa);
        const ny = Math.cos(b.wa);

        switch (b.kind) {
          case 'shell':
            shellShape(ctx, b, color);
            break;
          case 'segment': {
            limb(ctx, h, t, b.w0, b.w1, color);
            // crease at the head, mostly hidden by the previous plate
            limb(ctx, h, { x: h.x + (t.x - h.x) * 0.07, y: h.y + (t.y - h.y) * 0.07 }, b.w0 * 0.86, b.w0 * 0.82, C.shade);
            // quiet dorsal highlight
            const o0 = -0.32 * b.w0;
            const o1 = -0.32 * b.w1;
            limb(
              ctx,
              { x: h.x + (t.x - h.x) * 0.3 + nx * o0, y: h.y + (t.y - h.y) * 0.3 + ny * o0 },
              { x: h.x + (t.x - h.x) * 0.74 + nx * o1, y: h.y + (t.y - h.y) * 0.74 + ny * o1 },
              Math.max(1.2, b.w0 * 0.22),
              Math.max(0.8, b.w1 * 0.14),
              C.hi,
            );
            break;
          }
          case 'blade':
          case 'limb':
            limb(ctx, h, t, b.w0, b.w1, color);
            break;
          default:
            break;
        }
      }

      // ---------------------------------------------------------------- rig model

      /**
       * bone = {
       *   id, parent, attach: 'tail' | 'head',
       *   hx, hy, tx, ty,        // rest pose, world space — this is what you draw
       *   w0, w1, kind, layer
       * }
       * Parent-relative angles/offsets are derived in solve().
       */
      let BONES = [];
      let NEXT_ID = 0;

      function makeBone(parent, head, tail, opts = {}) {
        const b = {
          id: `b${NEXT_ID++}`,
          parent: parent ? parent.id : null,
          attach: opts.attach || 'tail',
          hx: head.x,
          hy: head.y,
          tx: tail.x,
          ty: tail.y,
          w0: opts.w0 ?? 10,
          w1: opts.w1 ?? 9,
          kind: opts.kind || 'limb',
          color: opts.color || (opts.kind === 'segment' || opts.kind === 'shell' ? 'body' : 'shade'),
          ball: opts.ball ?? (opts.kind === 'limb' || opts.kind === 'blade' ? 1 : 0),
          layer: opts.layer ?? BONES.length,
        };
        BONES.push(b);
        return b;
      }

      /**
       * Radii are a property of the *joint*, not the bone. A child that hangs off its parent's
       * tail therefore must not have its own base width — otherwise every joint is a step.
       * Called after any width edit; the parent wins.
       */
      function weld() {
        for (let pass = 0; pass < 3; pass += 1) {
          for (const b of BONES) {
            if (b.attach !== 'tail' || !b.parent) continue;
            const parent = BONES.find((x) => x.id === b.parent);
            if (parent) b.w0 = parent.w1;
          }
        }
      }

      /** Hierarchy order: parents before children. */
      function ordered(list) {
        const byId = new Map(list.map((b) => [b.id, b]));
        const out = [];
        const seen = new Set();
        const visit = (b) => {
          if (!b || seen.has(b.id)) return;
          seen.add(b.id);
          out.push(b);
          for (const c of list) if (c.parent === b.id) visit(c);
        };
        for (const b of list) if (!b.parent || !byId.has(b.parent)) visit(b);
        for (const b of list) visit(b);
        return out;
      }

      const REST = new Map();

      /**
       * Solve the rig for a pose. `delta(boneId, index, bone)` returns extra local degrees.
       * At delta 0 this reproduces the hand-placed rest geometry exactly.
       */
      function solve(delta) {
        REST.clear();
        const list = ordered(BONES);

        // pass 1: rest world angles, so parent-relative values are known.
        // The record carries the parent's REST head/tail — reading them off the bone itself
        // would be wrong once a pose is applied, and reading them off this record needs them here.
        for (const b of list) {
          const parent = b.parent ? REST.get(b.parent) : null;
          const restAng = ang({ x: b.hx, y: b.hy }, { x: b.tx, y: b.ty });
          const len = hyp({ x: b.hx, y: b.hy }, { x: b.tx, y: b.ty });
          const parentRestAng = parent ? parent.restAng : 0;
          const off = parent ? rot({ x: b.hx - parent.hx, y: b.hy - parent.hy }, -parentRestAng) : { x: 0, y: 0 };
          REST.set(b.id, {
            parentRestAng,
            localRest: restAng - parentRestAng,
            len,
            off,
            restAng,
            hx: b.hx,
            hy: b.hy,
          });
        }

        // pass 2: forward kinematics with the pose applied
        const out = new Map();
        for (const b of list) {
          const r = REST.get(b.id);
          const parent = b.parent ? out.get(b.parent) : null;
          const parentWa = parent ? parent.wa : 0;
          const wa = parentWa + r.localRest + deg(delta ? delta(b, list.indexOf(b)) : 0);
          const head =
            b.attach === 'tail' && parent
              ? { x: parent.tx, y: parent.ty }
              : parent
                ? (() => {
                    const o = rot(r.off, parentWa);
                    return { x: parent.hx + o.x, y: parent.hy + o.y };
                  })()
                : { x: b.hx, y: b.hy };
          out.set(b.id, {
            ...b,
            ...r,
            hx: head.x,
            hy: head.y,
            tx: head.x + Math.cos(wa) * r.len,
            ty: head.y + Math.sin(wa) * r.len,
            wa,
          });
        }
        return out;
      }

      /**
       * Joint caps.
       *
       * A rigid capsule per bone leaves a wedge-shaped notch on the outside of every bend: the
       * parent's tail and the child's head rotate away from each other. Filling each joint with a
       * disc of the joint's own radius makes a chain read as one continuous tube and cannot leak,
       * because the disc is centred exactly on the pivot and everything else rotates around it.
       *
       * Plates (segment/shell) default to 0: a shrimp's abdomen is *supposed* to show seams.
       */
      function drawBalls(ctx, list) {
        for (const b of list) {
          if (!b.ball) continue;
          const r = (b.w0 / 2) * b.ball;
          if (r < 0.3) continue;
          ctx.fillStyle = PAL[b.color] || C.body;
          ctx.beginPath();
          ctx.arc(b.hx, b.hy, r, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawRig(ctx, view, solved, opts = {}) {
        const list = [...solved.values()].sort((a, b) => a.layer - b.layer || a.id.localeCompare(b.id));

        if (view !== 'skeleton') {
          drawBalls(ctx, list);
          for (const b of list) drawBone(ctx, b);
        }
        if (view !== 'fill') {
          ctx.save();
          ctx.lineCap = 'round';
          for (const b of list) {
            const sel = opts.selected === b.id;
            ctx.strokeStyle = sel ? C.sel : C.bone;
            ctx.lineWidth = sel ? 2.4 : 1.2;
            ctx.globalAlpha = view === 'both' ? 0.95 : 1;
            ctx.beginPath();
            ctx.moveTo(b.hx, b.hy);
            ctx.lineTo(b.tx, b.ty);
            ctx.stroke();
          }
          ctx.globalAlpha = 1;
          // dots: dedupe shared joints
          const dots = [];
          for (const b of list) {
            for (const p of [
              { x: b.hx, y: b.hy },
              { x: b.tx, y: b.ty },
            ]) {
              if (!dots.some((d) => Math.hypot(d.x - p.x, d.y - p.y) < 3)) dots.push(p);
            }
          }
          for (const d of dots) {
            ctx.fillStyle = C.node;
            ctx.beginPath();
            ctx.arc(d.x, d.y, 3, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
      }

      // ---------------------------------------------------------------- preset

      /** The tuned shrimp, generated from the original local-angle rig. Nodes are world-space. */
      const PRESET = {"S":132,"bones":[
  {"id":"carapace","parent":null,"attach":"tail","head":[0,0],"tail":[34.3,-9.8],"w0":31.7,"w1":31.7,"kind":"shell","color":"body","layer":40,"ball":0},
  {"id":"abdomen.0","parent":"carapace","attach":"origin","head":[0,0],"tail":[-11,5.8],"w0":11.9,"w1":11.1,"kind":"segment","color":"body","layer":25,"ball":0},
  {"id":"abdomen.1","parent":"abdomen.0","attach":"tail","head":[-11,5.8],"tail":[-20.9,13.3],"w0":11.1,"w1":10.3,"kind":"segment","color":"body","layer":24,"ball":0},
  {"id":"abdomen.2","parent":"abdomen.1","attach":"tail","head":[-20.9,13.3],"tail":[-29.5,22.2],"w0":10.3,"w1":9.5,"kind":"segment","color":"body","layer":23,"ball":0},
  {"id":"abdomen.3","parent":"abdomen.2","attach":"tail","head":[-29.5,22.2],"tail":[-36.6,32.4],"w0":9.5,"w1":8.7,"kind":"segment","color":"body","layer":22,"ball":0},
  {"id":"abdomen.4","parent":"abdomen.3","attach":"tail","head":[-36.6,32.4],"tail":[-42,43.5],"w0":8.7,"w1":7.9,"kind":"segment","color":"body","layer":21,"ball":0},
  {"id":"abdomen.5","parent":"abdomen.4","attach":"tail","head":[-42,43.5],"tail":[-45.7,55.4],"w0":7.9,"w1":7.1,"kind":"segment","color":"body","layer":20,"ball":0},
  {"id":"tailroot","parent":"abdomen.5","attach":"tail","head":[-45.7,55.4],"tail":[-47.1,62.5],"w0":11.9,"w1":9.2,"kind":"limb","color":"body","layer":15,"ball":1},
  {"id":"flap.0","parent":"tailroot","attach":"tail","head":[-47.1,62.5],"tail":[-39.7,81.6],"w0":1.3,"w1":4.8,"kind":"blade","color":"shade","layer":10,"ball":1},
  {"id":"flap.1","parent":"tailroot","attach":"tail","head":[-47.1,62.5],"tail":[-45.3,82.9],"w0":1.3,"w1":4.8,"kind":"blade","color":"shade","layer":11,"ball":1},
  {"id":"flap.2","parent":"tailroot","attach":"tail","head":[-47.1,62.5],"tail":[-51,82.6],"w0":1.3,"w1":4.8,"kind":"blade","color":"shade","layer":12,"ball":1},
  {"id":"flap.3","parent":"tailroot","attach":"tail","head":[-47.1,62.5],"tail":[-56.3,80.8],"w0":1.3,"w1":4.8,"kind":"blade","color":"shade","layer":13,"ball":1},
  {"id":"flap.4","parent":"tailroot","attach":"tail","head":[-47.1,62.5],"tail":[-61,77.5],"w0":1.3,"w1":4.8,"kind":"blade","color":"shade","layer":14,"ball":1},
  {"id":"ant.a.0","parent":"carapace","attach":"origin","head":[29.1,-15.9],"tail":[42.3,-27.8],"w0":2.1,"w1":1.8,"kind":"limb","color":"shade","layer":50,"ball":1},
  {"id":"ant.a.1","parent":"ant.a.0","attach":"tail","head":[42.3,-27.8],"tail":[51.2,-43.2],"w0":1.8,"w1":1.6,"kind":"limb","color":"shade","layer":51,"ball":1},
  {"id":"ant.a.2","parent":"ant.a.1","attach":"tail","head":[51.2,-43.2],"tail":[54.9,-60.7],"w0":1.6,"w1":1.3,"kind":"limb","color":"shade","layer":52,"ball":1},
  {"id":"ant.a.3","parent":"ant.a.2","attach":"tail","head":[54.9,-60.7],"tail":[53.1,-78.4],"w0":1.3,"w1":1.1,"kind":"limb","color":"shade","layer":53,"ball":1},
  {"id":"ant.b.0","parent":"carapace","attach":"origin","head":[29.1,-15.9],"tail":[44.7,-24.5],"w0":2.1,"w1":1.8,"kind":"limb","color":"shade","layer":55,"ball":1},
  {"id":"ant.b.1","parent":"ant.b.0","attach":"tail","head":[44.7,-24.5],"tail":[59.4,-34.5],"w0":1.8,"w1":1.6,"kind":"limb","color":"shade","layer":56,"ball":1},
  {"id":"ant.b.2","parent":"ant.b.1","attach":"tail","head":[59.4,-34.5],"tail":[73.3,-45.7],"w0":1.6,"w1":1.3,"kind":"limb","color":"shade","layer":57,"ball":1},
  {"id":"ant.b.3","parent":"ant.b.2","attach":"tail","head":[73.3,-45.7],"tail":[86.1,-58.1],"w0":1.3,"w1":1.1,"kind":"limb","color":"shade","layer":58,"ball":1},
  {"id":"leg.0.thigh","parent":"carapace","attach":"head","head":[30.7,4.2],"tail":[26.2,16.6],"w0":3.4,"w1":2.5,"kind":"limb","color":"body","layer":30,"ball":1},
  {"id":"leg.0.shin","parent":"leg.0.thigh","attach":"tail","head":[26.2,16.6],"tail":[26.8,28.8],"w0":2.5,"w1":1.7,"kind":"limb","color":"body","layer":31,"ball":1},
  {"id":"leg.1.thigh","parent":"carapace","attach":"head","head":[19.5,8.1],"tail":[10.1,17.4],"w0":3.4,"w1":2.5,"kind":"limb","color":"body","layer":32,"ball":1},
  {"id":"leg.1.shin","parent":"leg.1.thigh","attach":"tail","head":[10.1,17.4],"tail":[17.6,27],"w0":2.5,"w1":1.7,"kind":"limb","color":"body","layer":33,"ball":1},
  {"id":"leg.2.thigh","parent":"carapace","attach":"head","head":[8.1,11.4],"tail":[-2.1,19.9],"w0":3.4,"w1":2.5,"kind":"limb","color":"body","layer":34,"ball":1},
  {"id":"leg.2.shin","parent":"leg.2.thigh","attach":"tail","head":[-2.1,19.9],"tail":[8.4,26.1],"w0":2.5,"w1":1.7,"kind":"limb","color":"body","layer":35,"ball":1}
]};

      // ---------------------------------------------------------------- pose tests

      const POSE_TESTS = {
        rest: () => 0,
        curl: (b) => (b.kind === 'segment' ? -12 : 0),
        open: (b) => (b.kind === 'segment' ? 8 : 0),
        wobble: (b, i) => (b.kind === 'segment' ? Math.sin(i * 0.9) * 9 : b.kind === 'limb' ? Math.sin(i * 1.7) * 5 : 0),
        // articulation stress test: fold every tube joint to +-70 degrees. This is the case
        // where rigid capsules visibly fail and joint caps earn their keep.
        stress: (b, i) => (b.kind === 'limb' || b.kind === 'blade' ? (i % 2 ? 70 : -70) : 0),
      };
      const POSE_ORDER = Object.keys(POSE_TESTS);

      // ---------------------------------------------------------------- boot

      const params = new URLSearchParams(location.search);
      const mode = params.get('mode') || 'build';
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');
      const DPR = window.devicePixelRatio || 1;

      function resetToPreset() {
        // PRESET is stored in the export format (head/tail arrays), so route it through the
        // same loader the import button uses — one code path, no silent format drift.
        importJson(JSON.stringify(PRESET));
      }
      resetToPreset();

      function exportJson() {
        const round = (v) => Math.round(v * 10) / 10;
        return JSON.stringify(
          {
            S,
            bones: BONES.map((b) => ({
              id: b.id,
              parent: b.parent,
              attach: b.attach,
              head: [round(b.hx), round(b.hy)],
              tail: [round(b.tx), round(b.ty)],
              w0: round(b.w0),
              w1: round(b.w1),
              kind: b.kind,
              color: b.color,
              ball: b.ball,
              layer: b.layer,
            })),
          },
          null,
          1,
        );
      }

      function importJson(text) {
        const data = JSON.parse(text);
        BONES = data.bones.map((b) => ({
          id: b.id,
          parent: b.parent,
          attach: b.attach,
          hx: b.head[0],
          hy: b.head[1],
          tx: b.tail[0],
          ty: b.tail[1],
          w0: b.w0,
          w1: b.w1,
          kind: b.kind,
          color: b.color || 'body',
          ball: b.ball ?? 0,
          layer: b.layer ?? 0,
        }));
        NEXT_ID = Math.max(0, ...BONES.map((b) => Number(String(b.id).replace(/\D/g, '')) || 0)) + 1;
      }

      // ---------------------------------------------------------------- static modes

      function staticMode() {
        canvas.width = innerWidth * DPR;
        canvas.height = innerHeight * DPR;
        canvas.style.width = '100vw';
        canvas.style.height = '100vh';
        const w = innerWidth;
        const h = innerHeight;
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        ctx.fillStyle = '#10141a';
        ctx.fillRect(0, 0, w, h);

        const solved = solve(null);
        const view = mode === 'small' ? 'fill' : mode === 'skeleton' ? 'skeleton' : 'fill';

        if (mode === 'compare') {
          const cell = w / 3;
          ['fill', 'skeleton', 'both'].forEach((v, i) => {
            ctx.strokeStyle = 'rgba(255,255,255,0.06)';
            ctx.strokeRect(i * cell + 0.5, 0.5, cell - 1, h - 1);
            ctx.save();
            ctx.translate(i * cell + cell * 0.62, h * 0.46);
            ctx.scale(cell / 300, cell / 300);
            drawRig(ctx, v, solved);
            ctx.restore();
          });
          return;
        }

        if (mode === 'small') {
          // measure, then fit into 64 px and upscale nearest for the silhouette test
          const probe = document.createElement('canvas');
          probe.width = 700;
          probe.height = 700;
          const pctx = probe.getContext('2d');
          pctx.translate(330, 500);
          drawRig(pctx, 'fill', solved);
          const px = pctx.getImageData(0, 0, 700, 700).data;
          let minX = 700;
          let minY = 700;
          let maxX = 0;
          let maxY = 0;
          for (let y = 0; y < 700; y += 1) {
            for (let x = 0; x < 700; x += 1) {
              if (px[(y * 700 + x) * 4 + 3] > 8) {
                minX = Math.min(minX, x);
                maxX = Math.max(maxX, x);
                minY = Math.min(minY, y);
                maxY = Math.max(maxY, y);
              }
            }
          }
          const bw = Math.max(1, maxX - minX + 1);
          const bh = Math.max(1, maxY - minY + 1);
          const k = 56 / Math.max(bw, bh);
          const off = document.createElement('canvas');
          off.width = 64;
          off.height = 64;
          const octx = off.getContext('2d');
          octx.fillStyle = '#12171d';
          octx.fillRect(0, 0, 64, 64);
          octx.save();
          octx.translate((64 - bw * k) / 2 - minX * k, (64 - bh * k) / 2 - minY * k);
          octx.scale(k, k);
          octx.translate(330, 500);
          drawRig(octx, 'fill', solved);
          octx.restore();
          const up = Math.min(w, h) - 80;
          ctx.imageSmoothingEnabled = false;
          ctx.drawImage(off, 40, 40, up, up);
          return;
        }

        ctx.save();
        ctx.translate(w * 0.55, h * 0.5);
        ctx.scale(1.4, 1.4);
        drawRig(ctx, view, solved);
        ctx.restore();
      }

      // ---------------------------------------------------------------- builder

      function builder() {
        let tool = 'draw';
        let view = 'both';
        let pose = 'rest';
        let wobbleOn = false;
        let selected = null;
        let drag = null;

        // --- chrome
        const bar = document.createElement('div');
        bar.className = 'bar';
        const buttons = [];
        const mk = (label, onClick, on = false) => {
          const b = document.createElement('button');
          b.textContent = label;
          if (on) b.classList.add('on');
          b.onclick = () => {
            onClick();
            refreshButtons();
          };
          bar.append(b);
          buttons.push(b);
          return b;
        };
        const toolBtn = mk('tool: draw', () => {
          tool = tool === 'draw' ? 'move' : 'draw';
        }, true);
        const viewBtn = mk('view: both', () => {
          view = ['both', 'fill', 'skeleton'][(['both', 'fill', 'skeleton'].indexOf(view) + 1) % 3];
        }, true);
        const poseBtn = mk('pose: rest', () => {
          pose = POSE_ORDER[(POSE_ORDER.indexOf(pose) + 1) % POSE_ORDER.length];
        });
        const sep = document.createElement('div');
        sep.className = 'sep';
        bar.append(sep);
        mk('reset shrimp', () => {
          resetToPreset();
          selected = null;
        });
        mk('clear', () => {
          BONES = [];
          NEXT_ID = 0;
          selected = null;
        });
        mk('export', () => openText(exportJson()));
        mk('import', () =>
          openText('', (text) => {
            try {
              importJson(text);
              selected = null;
              return true;
            } catch (e) {
              alert(`bad JSON: ${e.message}`);
              return false;
            }
          }),
        );

        function refreshButtons() {
          toolBtn.textContent = `tool: ${tool}`;
          viewBtn.textContent = `view: ${view}`;
          poseBtn.textContent = `pose: ${pose}`;
          toolBtn.classList.toggle('on', tool === 'draw');
        }

        const out = document.createElement('textarea');
        function openText(value, onApply) {
          out.style.display = 'block';
          out.value = value;
          out.focus();
          out.select();
          out.onkeydown = (ev) => {
            if (ev.key === 'Escape') {
              out.style.display = 'none';
              out.blur();
            } else if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) {
              if (onApply && onApply(out.value)) {
                out.style.display = 'none';
                out.blur();
              }
            }
          };
        }
        document.body.append(bar, out);

        const hud = document.createElement('div');
        hud.className = 'hud';
        document.body.append(hud);

        // --- view
        const viewT = { ox: 0, oy: 0, k: 1 };
        const place = () => {
          canvas.width = innerWidth * DPR;
          canvas.height = innerHeight * DPR;
          canvas.style.width = '100vw';
          canvas.style.height = '100vh';
          viewT.ox = innerWidth * 0.6;
          viewT.oy = innerHeight * 0.52;
          viewT.k = Math.min(innerWidth / 900, innerHeight / 620);
        };
        place();
        addEventListener('resize', place);

        const toRig = (ev) => ({
          x: (ev.clientX - viewT.ox) / viewT.k,
          y: (ev.clientY - viewT.oy) / viewT.k,
        });

        const delta = (b, i) => POSE_TESTS[pose](b, i) + (wobbleOn ? Math.sin(performance.now() / 260 + i * 0.7) * 4 : 0);

        function pickNode(p) {
          let best = null;
          for (const b of BONES) {
            for (const [end, pt] of [
              ['head', { x: b.hx, y: b.hy }],
              ['tail', { x: b.tx, y: b.ty }],
            ]) {
              const d = Math.hypot(p.x - pt.x, p.y - pt.y);
              if (d < Math.max(7, 10 / viewT.k) && (!best || d < best.d)) best = { bone: b, end, d, at: pt };
            }
          }
          return best;
        }

        function pickBone(p) {
          let best = null;
          for (const b of BONES) {
            const dx = b.tx - b.hx;
            const dy = b.ty - b.hy;
            const l2 = dx * dx + dy * dy || 1;
            const t = Math.max(0, Math.min(1, ((p.x - b.hx) * dx + (p.y - b.hy) * dy) / l2));
            const d = Math.hypot(p.x - (b.hx + dx * t), p.y - (b.hy + dy * t));
            if (d < Math.max(11, 14 / viewT.k) * (0.4 + (b.w0 / 40)) && (!best || d < best.d)) best = { bone: b, d };
          }
          return best;
        }

        canvas.addEventListener('pointerdown', (ev) => {
          const p = toRig(ev);
          canvas.setPointerCapture(ev.pointerId);
          const node = pickNode(p);

          if (tool === 'draw') {
            const parent = node ? node.bone : null;
            const attach = node && node.end === 'tail' ? 'tail' : node ? 'head' : 'tail';
            // while drawing, a provisional bone is added and reshaped on move
            const kind = parent ? (parent.kind === 'shell' ? 'segment' : parent.kind) : 'limb';
            const base = parent && node.end === 'tail' ? parent.w1 : parent ? parent.w0 * 0.6 : 10;
            const b = makeBone(parent, p, p, {
              attach,
              w0: base,
              w1: base * 0.92,
              kind,
              color: parent ? parent.color : kind === 'segment' ? 'body' : 'shade',
              ball: parent ? parent.ball : kind === 'limb' ? 1 : 0,
              layer: parent ? parent.layer + 1 : 0,
            });
            selected = b.id;
            drag = { mode: 'draw', bone: b, start: p };
            return;
          }

          if (node) {
            selected = node.bone.id;
            drag = { mode: 'node', bone: node.bone, end: node.end, start: p, orig: { ...node.bone } };
          } else {
            const hit = pickBone(p);
            if (hit) {
              selected = hit.bone.id;
              drag = { mode: 'swing', bone: hit.bone, start: p, orig: { ...hit.bone } };
            }
          }
        });

        canvas.addEventListener('pointermove', (ev) => {
          if (!drag) return;
          const p = toRig(ev);
          const b = drag.bone;

          if (drag.mode === 'draw') {
            b.tx = p.x;
            b.ty = p.y;
            return;
          }

          if (drag.mode === 'node') {
            if (drag.end === 'tail') {
              b.tx = p.x;
              b.ty = p.y;
            } else {
              b.hx = p.x;
              b.hy = p.y;
              // keep the joint welded: a head on the parent's tail drags the parent's tail too
              if (b.attach === 'tail' && b.parent) {
                const parent = BONES.find((x) => x.id === b.parent);
                if (parent) {
                  parent.tx = p.x;
                  parent.ty = p.y;
                }
              }
            }
            return;
          }

          if (drag.mode === 'swing') {
            const o = drag.orig;
            const len = Math.hypot(o.tx - o.hx, o.ty - o.hy) || 1;
            const a = Math.atan2(p.y - o.hy, p.x - o.hx);
            b.tx = o.hx + Math.cos(a) * len;
            b.ty = o.hy + Math.sin(a) * len;
          }
        });

        const endDrag = () => {
          if (drag && drag.mode === 'draw') {
            const b = drag.bone;
            // a click with no drag is a click, not a bone
            if (Math.hypot(b.tx - b.hx, b.ty - b.hy) < 2) BONES = BONES.filter((x) => x !== b);
          }
          drag = null;
        };
        canvas.addEventListener('pointerup', endDrag);
        canvas.addEventListener('pointercancel', endDrag);

        addEventListener('keydown', (ev) => {
          if (document.activeElement === out) return;
          const bone = BONES.find((b) => b.id === selected);
          const key = ev.key;

          if (key === 'Tab') {
            ev.preventDefault();
            tool = tool === 'draw' ? 'move' : 'draw';
          } else if (key === 'v' || key === 'V') {
            view = ['both', 'fill', 'skeleton'][(['both', 'fill', 'skeleton'].indexOf(view) + 1) % 3];
          } else if (key === 'g' || key === 'G') {
            wobbleOn = !wobbleOn;
          } else if (key === 'r' || key === 'R') {
            resetToPreset();
            selected = null;
          } else if (key === 'x' || key === 'X') {
            BONES = [];
            NEXT_ID = 0;
            selected = null;
          } else if (key === 'c' || key === 'C') {
            ev.preventDefault();
            openText(exportJson());
          } else if (key === 'l' || key === 'L') {
            openText('', (text) => {
              try {
                importJson(text);
                selected = null;
                return true;
              } catch {
                return false;
              }
            });
          } else if (ev.key.startsWith('Arrow') && bone) {
            ev.preventDefault();
            const step = ev.shiftKey ? 5 : 1;
            const dx = ev.key === 'ArrowLeft' ? -step : ev.key === 'ArrowRight' ? step : 0;
            const dy = ev.key === 'ArrowUp' ? -step : ev.key === 'ArrowDown' ? step : 0;
            bone.tx += dx;
            bone.ty += dy;
          } else if (!bone) {
            return;
          } else if (key === 'Delete' || key === 'Backspace') {
            ev.preventDefault();
            const dead = new Set([bone.id]);
            let grew = true;
            while (grew) {
              grew = false;
              for (const b of BONES) {
                if (b.parent && dead.has(b.parent) && !dead.has(b.id)) {
                  dead.add(b.id);
                  grew = true;
                }
              }
            }
            BONES = BONES.filter((b) => !dead.has(b.id));
            selected = null;
          } else if (key === 'k' || key === 'K') {
            bone.kind = KINDS[(KINDS.indexOf(bone.kind) + 1) % KINDS.length];
          } else if (key === '[' || key === ']') {
            const f = key === ']' ? 1.08 : 1 / 1.08;
            if (ev.shiftKey) {
              bone.w1 = Math.max(0.6, bone.w1 * f);
            } else {
              // widening the base of a tail-attached bone means widening the parent's tail
              if (bone.attach === 'tail' && bone.parent) {
                const parent = BONES.find((x) => x.id === bone.parent);
                if (parent) parent.w1 = Math.max(0.6, parent.w1 * f);
              }
              bone.w0 = Math.max(0.6, bone.w0 * f);
              bone.w1 = Math.max(0.6, bone.w1 * f);
            }
            weld();
          } else if (key === 'b' || key === 'B') {
            bone.ball = Math.min(2.6, (bone.ball || 0) + 0.2);
          } else if (key === 'n' || key === 'N') {
            bone.ball = Math.max(0, (bone.ball || 0) - 0.2);
          } else if (key === 'm' || key === 'M') {
            bone.color = bone.color === 'body' ? 'shade' : 'body';
          } else if (key === ',' || key === '.') {
            bone.layer += key === '.' ? 1 : -1;
          }
          refreshButtons();
        });

        window.__rig = {
          get bones() {
            return BONES;
          },
        };

        window.__dbg = () => {
          const solved = solve(delta);
          return {
            total: BONES.length,
            solved: solved.size,
            sample: BONES.slice(0, 5).map((b) => ({ id: b.id, hx: b.hx, hy: b.hy, tx: b.tx, ty: b.ty, kind: b.kind, layer: b.layer })),
            solvedSample: [...solved.values()].slice(0, 5).map((b) => ({ id: b.id, len: b.len, hx: Math.round(b.hx), hy: Math.round(b.hy), wa: Math.round(b.wa * 57.3) })),
          };
        };

        // --- loop
        const frame = () => {
          ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
          ctx.fillStyle = '#10141a';
          ctx.fillRect(0, 0, innerWidth, innerHeight);

          // grid
          ctx.strokeStyle = 'rgba(255,255,255,0.035)';
          ctx.lineWidth = 1;
          for (let gx = -10; gx < 10; gx += 1) {
            const X = viewT.ox + gx * 40 * viewT.k;
            ctx.beginPath();
            ctx.moveTo(X, 0);
            ctx.lineTo(X, innerHeight);
            ctx.stroke();
          }

          ctx.save();
          ctx.translate(viewT.ox, viewT.oy);
          ctx.scale(viewT.k, viewT.k);
          const solved = solve(delta);
          drawRig(ctx, view, solved, { selected });
          // selection halo
          if (selected && solved.has(selected)) {
            const b = solved.get(selected);
            ctx.strokeStyle = 'rgba(255,209,102,0.55)';
            ctx.lineWidth = 6 / viewT.k;
            ctx.beginPath();
            ctx.moveTo(b.hx, b.hy);
            ctx.lineTo(b.tx, b.ty);
            ctx.stroke();
          }
          ctx.restore();

          const bone = BONES.find((b) => b.id === selected);
          hud.innerHTML =
            `<b>${bone ? bone.id : 'no selection'}</b>` +
            (bone
              ? `  ${bone.kind}/${bone.color} · w ${bone.w0.toFixed(1)}→${bone.w1.toFixed(1)} · joint cap ${bone.ball.toFixed(1)} · layer ${bone.layer} · parent ${bone.parent || '—'}`
              : '') +
            `   <i>tool ${tool}</i> · pose ${pose} · ${BONES.length} bones${wobbleOn ? ' · wobble' : ''}\n` +
            `draw: press empty = root, press a dot = child, drag out · move: drag dot / drag bone to swing · ` +
            `tab tool · K kind · M colour · [ ] width (welds at joints) · B/N joint cap · , . layer · del · R shrimp · X clear · C export · L import · V view · G wobble`;

          requestAnimationFrame(frame);
        };
        requestAnimationFrame(frame);
      }

      if (mode === 'build') builder();
      else staticMode();
    </script>
  </body>
</html>
